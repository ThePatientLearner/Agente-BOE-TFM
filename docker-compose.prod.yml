# Producción en VPS: solo API + Postgres.
# La web sigue en Vercel; no se despliega el servicio `web` aquí.
#
# Uso en el servidor:
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -s http://127.0.0.1:3001/health
#
# El túnel NO arranca con eso: está en el perfil `cutover` a propósito
# (ver el servicio `tunnel` al final). Hasta entonces esto es un servidor
# de pruebas invisible desde fuera.
#
# Requisitos:
#   - archivo `.env` en la raíz (mismas claves que en el Mac)
#   - DATABASE_URL se fuerza a la red Docker (`@db`), no uses localhost
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boe
      POSTGRES_PASSWORD: boe
      POSTGRES_DB: boe_inspector
    volumes:
      - boe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boe -d boe_inspector"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin `ports:`: Postgres solo es visible dentro de la red Docker.
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/monolith/Dockerfile
    env_file: .env
    environment:
      # Dentro de Compose el host de la DB es el nombre del servicio.
      DATABASE_URL: postgres://boe:boe@db:5432/boe_inspector
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://agenteboe.com}
    depends_on:
      db:
        condition: service_healthy
    # Solo localhost del VPS. Cloudflared llega por la red de Docker; esta
    # publicación existe únicamente para poder hacer curl desde el propio
    # servidor (y desde el Mac por un túnel SSH) mientras se prueba.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  # El túnel Cloudflare: lo que hace que api.agenteboe.com llegue aquí.
  #
  # `profiles: [cutover]` lo deja fuera del `up -d` normal, y eso no es
  # cosmético. Un túnel con nombre admite varias réplicas a la vez y
  # Cloudflare reparte el tráfico entre todas: si esto arrancara mientras
  # el Mac sigue sirviendo, la mitad de las visitas reales caerían en un
  # servidor con la base de datos a medio restaurar. El túnel se levanta
  # solo en el cutover, y en ese mismo momento se apaga el del Mac.
  #
  #   docker compose -f docker-compose.prod.yml --profile cutover up -d tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["cutover"]
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  boe_pgdata:
    name: boe_inspector_pgdata
