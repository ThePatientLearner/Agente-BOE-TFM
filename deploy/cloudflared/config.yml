# Configuración del túnel Cloudflare EN EL VPS.
#
# Es el mismo túnel con nombre que hoy corre en el Mac
# (TU_UUID_DE_TUNEL), así que api.agenteboe.com sigue
# apuntando aquí sin tocar un solo registro DNS: el hostname está atado al
# túnel, no a una IP. Mudarse es mover quién levanta el túnel.
#
# Diferencia con el config del Mac: allí el destino es 127.0.0.1:3001
# porque el monolito corre suelto en el host. Aquí cloudflared es un
# contenedor más del compose, así que llega al monolito por el nombre del
# servicio en la red de Docker.
#
# El fichero de credenciales NO está en git (ver .gitignore). Se sube por
# scp desde el Mac: es la prueba de que este servidor puede hablar en
# nombre del túnel, y con él cualquiera podría suplantar la API.
tunnel: TU_UUID_DE_TUNEL
credentials-file: /etc/cloudflared/TU_UUID_DE_TUNEL.json

ingress:
  - hostname: api.agenteboe.com
    service: http://app:3001
  # Regla final obligatoria: cualquier otra cosa se rechaza.
  - service: http_status:404
